plugins {
    id 'com.android.application'
}

android {
    namespace 'com.firefoxdl.mod'
    compileSdk 34

    defaultConfig {
        applicationId "com.firefoxdl.mod"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Xposed/LSPosed API：仅在编译期需要，运行时由框架提供，切勿打进去
    compileOnly 'de.robv.android.xposed:api:82'
}
